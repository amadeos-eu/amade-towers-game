dialog.about.text=Orchi, lupi feroci e troll marciano lungo la strada sul tuo castello, e le tue torri stanno accanto. In campo aperto non c’è strada: prendono la via più breve, e ogni torre che costruisci la allunga. La scelta del campo di battaglia passa dall’uno all’altro. Le tue stelle su tre campi di battaglia vengono salvate.
dialog.about.rules=Gli arcieri tirano veloci, i cannoni colpiscono tutto dove la palla esplode, il gelo rallenta tutto intorno a sé. Una torre può stare ovunque sull’erba; in campo aperto, purché una via per il castello resti aperta. N chiama prima l’ondata successiva in cambio d’oro; F raddoppia la velocità; F3 mostra il campo di flusso che seguono i nemici.
