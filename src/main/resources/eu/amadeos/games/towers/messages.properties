dialog.about.text=Orcs, dire wolves and trolls march on your castle along the road, and your towers stand beside it. On open ground there is no road: they take the shortest way, and every tower you build makes that way longer. The choice of a battlefield switches between the two. Your stars on three battlefields are saved.
dialog.about.rules=Archers shoot fast, cannons hit everything where the ball bursts, frost slows all around it. A tower may stand anywhere on grass; on open ground, as long as one way to the castle stays open. N calls the next wave early for gold; F doubles the speed; F3 shows the flow field the enemies follow.
