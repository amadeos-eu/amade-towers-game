dialog.about.text=Orcos, lobos terribles y trolls marchan por el camino contra tu castillo, y tus torres se alzan a su lado. En campo abierto no hay camino: toman el más corto, y cada torre que construyes lo alarga. Al elegir el campo de batalla cambias entre los dos. Tus estrellas en tres campos de batalla se guardan.
dialog.about.rules=Los arqueros disparan rápido, los cañones alcanzan todo donde estalla la bala, la escarcha frena todo a su alrededor. Una torre puede estar en cualquier lugar de hierba; en campo abierto, mientras quede abierto un camino al castillo. N llama antes a la siguiente oleada a cambio de oro; F dobla la velocidad; F3 muestra el campo de flujo que siguen los enemigos.
