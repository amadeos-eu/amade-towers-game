dialog.about.text=Orks, Schreckenswölfe und Trolle ziehen gegen deine Burg. Es gibt keine Straße: Sie nehmen den kürzesten Weg über das offene Land, und jeder Turm, den du baust, macht diesen Weg länger. Deine Sterne auf drei Schlachtfeldern werden gespeichert.
dialog.about.rules=Bogenschützen schießen schnell, Kanonen treffen alles, wo die Kugel platzt, Frost bremst alles um sich herum. Ein Turm darf überall auf Gras stehen, solange ein Weg zur Burg offen bleibt. N ruft die nächste Welle früher, für Gold; F verdoppelt das Tempo; F3 zeigt das Flussfeld, dem die Feinde folgen.
