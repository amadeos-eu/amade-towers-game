dialog.about.text=Orques, loups géants et trolls marchent sur ton château. Il n’y a pas de route : ils prennent le chemin le plus court à travers la plaine, et chaque tour que tu bâtis l’allonge. Tes étoiles sur trois champs de bataille sont enregistrées.
dialog.about.rules=Les archers tirent vite, les canons touchent tout là où le boulet éclate, le givre ralentit tout autour de lui. Une tour peut se dresser partout sur l’herbe, tant qu’un chemin vers le château reste ouvert. N appelle la vague suivante plus tôt contre de l’or ; F double la vitesse ; F3 montre le champ de flux que suivent les ennemis.
